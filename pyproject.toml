[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossvenue"
version = "0.9.0"
description = "Cross-asset paper trading, deterministic replay, and market-making research"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "sortedcontainers>=2.4.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    "websocket-client>=1.6.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy==1.18.2",
    "ruff==0.14.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]
market-data = [
    "databento",
]
verification = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "playwright>=1.40.0",
]

[project.scripts]
crossvenue = "src.runtime.paper_cli:main"
paper-trader = "src.runtime.paper_cli:main"
paper-account = "src.runtime.account_admin:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "browser: isolated local browser acceptance; Chromium installation required",
    "performance: explicit measured load and soak tests",
    "live: explicitly configured read-only provider acceptance",
]
